name: Generate Profile Summary Cards

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate dark theme cards
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          NAME: Vitor Correia
          TIME_ZONE: America/Sao_Paulo
          THEME: github_dark
          AUTO_PUSH: false

      - name: Stage dark theme cards
        run: |
          mkdir -p cards_dist
          cp -r profile-summary-card-output/github_dark cards_dist/github_dark

      - name: Generate light theme cards
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          NAME: Vitor Correia
          TIME_ZONE: America/Sao_Paulo
          THEME: default
          AUTO_PUSH: false

      - name: Stage light theme cards
        run: cp -r profile-summary-card-output/default cards_dist/default

      - name: Publish cards to stats branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: stats
          build_dir: cards_dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
